  <title>Yomu · More</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/_expo/static/css/glass-b8012aec7a06ecd6e8c5e04e9e0a7b17.css" />
  <style>
    /* The whole of a rail: every title by an author, or everything like a
       title, behind the arrow on a series page. Hand-written, like find.html,
       and dressed in the same tile so the ratings and the tag chips the
       shell adds to Discover's grid land here unchanged. */
    body{margin:0;background:var(--bg);color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
         -webkit-tap-highlight-color:transparent}
    .wrap{max-width:1240px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px 120px}

    .bar{display:flex;align-items:flex-start;gap:14px}
    .back{flex:none;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);
          background:var(--surface);color:var(--text);font-size:18px;line-height:1;cursor:pointer;margin-top:4px}
    .back:hover{border-color:var(--accentLine)}
    .head{min-width:0}
    .eyebrow{display:block;font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--faint)}
    h1{margin:4px 0 0;font-size:clamp(22px,4.6vw,30px);font-weight:800;letter-spacing:-.028em;line-height:1.15;
       font-family:var(--font-display,inherit);font-variation-settings:'wdth' 108;text-wrap:balance}
    .sub{margin:6px 0 0;font-size:12px;color:var(--faint);letter-spacing:.04em;text-transform:uppercase}
    .sub[hidden]{display:none}

    .meta{color:var(--dim);font-size:12.5px;margin:18px 2px 6px;min-height:16px}
    .empty{color:var(--muted);font-size:14px;line-height:1.6;padding:32px 4px;text-align:center}
    .empty[hidden]{display:none}

    /* --- the tile grid, as Discover draws it ---------------------------- */
    .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:4px}

    .tile{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:2/3;display:block;
          border:1px solid var(--line);border-radius:12px;background:#172531;
          min-width:0;padding:0;font:inherit;color:inherit;text-align:left;text-decoration:none;cursor:pointer;
          transition:border-color .15s,transform .15s}
    .tile:hover{border-color:#b5c9df60;transform:translateY(-2px)}
    .tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

    .tile-art{position:absolute;inset:0;z-index:-3;
              background:linear-gradient(145deg,#567591,#141d30)}
    .tile-art img{width:100%;height:100%;object-fit:cover;display:block}
    /* Blurred dark lower edge, then the sharp gradient the copy sits on. */
    .tile::before{content:"";position:absolute;inset:68% -12px -12px;z-index:-2;
                  background:#101a25b3;filter:blur(18px);pointer-events:none}
    .tile::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
                 background:linear-gradient(180deg,#07101922 0,transparent 60%,
                            #0c151b70 80%,#0c151bf5 100%)}

    .tile-copy{position:absolute;bottom:10px;left:10px;right:10px;color:#fff;text-shadow:0 1px 3px #0b131bb3}
    .tile-copy .t{font-size:12px;font-weight:650;line-height:1.3;
                  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
                  overflow:hidden}
    .tile-copy small{display:block;margin-top:4px;font-size:11px;color:#ffffffd1;
                     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* The completed chip, top-left, clear of nothing: these tiles have no save control. */
    .tags{position:absolute;top:8px;left:8px;right:8px;z-index:2;
          display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
    .tags img{height:22px;width:auto;max-width:100%;object-fit:contain;object-position:left top}

    @media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:767px){
      .wrap{padding-left:16px;padding-right:16px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .tile-copy .t{font-size:13px}
      .back{min-width:44px;min-height:44px}
    }
    @media(prefers-reduced-motion:reduce){.tile{transition:none}}
  </style>

eet" href="/yomu-look.css"><script src="/yomu-look.js" defer></script><script src="/yomu-ratings.js" defer></script><script src="/yomu-anilist.js" defer></script><script src="/yomu-open-title.js" defer></script><script src="/yomu-fabric-route.js" defer></script><script src="/yomu-rank.js" defer></script><script src="/yomu-rails.js" defer></script><script src="/yomu-mori.js" defer></script><link rel="stylesheet" href="/yomu-skin.css"><link rel="stylesheet" href="/yomu-skins.css"><script src="/yomu-controls.js" defer></script><link rel="stylesheet" href="/yomu-controls-base.css"><link rel="stylesheet" href="/yomu-controls-components.css"></head>
<body>
<main class="wrap" id="wrap">
  <div class="bar">
    <button class="back" id="back" aria-label="Back">‹</button>
    <div class="head">
      <span class="eyebrow" id="kicker">More from</span>
      <h1 id="title">…</h1>
      <p class="sub" id="sub" hidden></p>
    </div>
  </div>

  <p class="meta" id="meta"></p>
  <div id="results" class="grid yt-grid"></div>
  <p class="empty" id="empty" hidden></p>
</main>

<script>
(async () => {
  'use strict';

  /* Paper when nothing is stored, as find.html and the app itself default. */

  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const kind = ['alike', 'rail'].includes(params.get('kind')) ? params.get('kind') : 'author';
  const id = (params.get('id') || '').trim();
  const name = (params.get('name') || params.get('title') || '').trim();
  let adult = false;
  try { adult = localStorage.getItem('yomu.v1.adult') === 'on'; } catch {}

  $('back').addEventListener('click', () => {
    if (history.length > 1) history.back();
    else location.href = '/';
  });

  const UUID = /^[0-9a-f-]{36}$/i;

  function heading(kicker, title, sub) {
    $('kicker').textContent = kicker;
    $('title').textContent = title;
    $('sub').textContent = sub || '';
    $('sub').hidden = !sub;
    document.title = 'Yomu · ' + title;
  }

  function fail(message) {
    $('meta').textContent = '';
    $('empty').textContent = message;
    $('empty').hidden = false;
  }

  /* --- a whole rail, on its own screen ------------------------------------ *
   *
   * A rail is a horizontal strip, and appending fourteen more cards to the
   * right-hand end of one puts them outside the viewport: the reader presses
   * the control, nothing they can see changes, and the honest conclusion is
   * that the button is broken. So a rail sends them here instead -- the same
   * titles as a grid that grows downwards, where more *looks* like more, with
   * the back button this page already has.
   *
   * Append still belongs on the full library and on search results, because
   * those are vertical grids and the growth is visible in place.
   *
   * AniList is asked from the browser here for the same reason the rails do
   * it: it answers a Cloudflare Worker with 403.
   */
  const RAILS = {
    trending: { label: 'Trending now', why: 'Moving fastest this week', sort: 'TRENDING_DESC', badge: 'Trending' },
    popular: { label: 'Popular right now', why: 'What the most people are reading', sort: 'POPULARITY_DESC', badge: null },
    top: { label: 'Highest rated', why: 'Rated highest by readers', sort: 'SCORE_DESC', badge: null },
    gems: { label: 'Hidden gems', why: 'Loved, and not yet everywhere', sort: 'SCORE_DESC', badge: 'Gem', extra: 'averageScore_greater: 75, popularity_lesser: 20000' },
    fresh: { label: 'New series', why: 'Started recently', sort: 'START_DATE_DESC', badge: 'New', extra: 'status: RELEASING' },
  };
  const COUNTRY = { manga: 'JP', manhwa: 'KR', manhua: 'CN' };
  const PER_PAGE = 30;

  async function railScreen() {
    const rail = RAILS[id];
    const type = (params.get('type') || 'all').toLowerCase();
    if (!rail) {
      heading('More', 'Unknown shelf', '');
      fail('That shelf does not exist. Go back and pick one from Home or Discover.');
      return;
    }
    const typeName = type !== 'all' && COUNTRY[type] ? ' · ' + type[0].toUpperCase() + type.slice(1) : '';
    heading('Every title in', rail.label, rail.why + typeName);

    const seen = new Set();
    const key = (t) => String(t || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

    async function page(n) {
      const args = [
        'type: MANGA',
        `sort: ${rail.sort}`,
        'isAdult: false',
        COUNTRY[type] ? `countryOfOrigin: ${COUNTRY[type]}` : '',
        rail.extra || '',
      ].filter(Boolean).join(', ');
      const query = `query { Page(page: ${n}, perPage: ${PER_PAGE}) { media(${args}) {
        id title { english romaji native } coverImage { large medium }
        averageScore status countryOfOrigin startDate { year } } } }`;
      const response = await fetch('https://graphql.anilist.co', {
        method: 'POST',
        headers: { 'content-type': 'application/json', accept: 'application/json' },
        body: JSON.stringify({ query }),
      });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      const body = await response.json();
      if (body?.errors?.length) throw new Error(body.errors[0]?.message || 'graphql');
      return body?.data?.Page?.media || [];
    }

    function draw(rows) {
      let added = 0;
      for (const media of rows) {
        const t = media?.title?.english || media?.title?.romaji || media?.title?.native;
        if (!t || seen.has(key(t))) continue;
        seen.add(key(t));
        $('results').append(window.YomuTitleCard.create({
          id: media.id,
          anilistId: media.id,
          title: t,
          cover: media.coverImage?.large || media.coverImage?.medium || '',
          score: media.averageScore ?? null,
          status: media.status || '',
          country: media.countryOfOrigin || '',
          year: media.startDate?.year ?? null,
        }, { badge: rail.badge, source: false }));
        added += 1;
      }
      return added;
    }

    $('meta').textContent = 'Asking AniList…';
    try {
      const drawn = draw(await page(1));
      if (!drawn) {
        $('meta').textContent = '';
        fail('AniList returned nothing for this shelf right now. Try again in a moment.');
        return;
      }
      $('meta').textContent = `${seen.size} titles`;
    } catch (error) {
      $('meta').textContent = '';
      fail('Could not reach AniList: ' + (error && error.message ? error.message : error));
      return;
    }

    /* The same single-owner pager the rest of the app uses, on a grid where
       the growth is visible. */
    const foot = document.createElement('div');
    foot.className = 'yl-foot';
    document.querySelector('main').append(foot);
    window.YomuPager?.claim(foot, {
      key: 'rail:' + id,
      scope: 'library',
      label: 'Load more',
      aria: 'Load more titles in ' + rail.label,
      onMore: async ({ page: n }) => {
        const added = draw(await page(n));
        $('meta').textContent = `${seen.size} titles`;
        return added > 0;
      },
    });
  }

  if (kind === 'rail') { await railScreen(); return; }

  if (kind === 'author') heading('More from', name || 'this author', '');
  else heading('You might like', name ? 'Like ' + name : 'Similar titles', '');

  if (!UUID.test(id)) {
    fail('This page needs a title to start from. Open a series and use the arrow beside its rail.');
    return;
  }

  /* One line of facts under the name: the year and the status for a
     bibliography, the author for a look-alike, where the name is the news. */
  const facts = (t) => (kind === 'alike' && t.author ? t.author : [t.year, t.status].filter(Boolean).join(' · '));

  /* The same card as Home, Discover and the full library: yomu-titlecard.js.
     This page used to hand-build a cover-filled tile of its own, which is one
     of the four renderers the recovery pass collapsed into one. */
  function tile(t) {
    const node = window.YomuTitleCard.create(
      { ...t, providers: [{ id: 'mangadex', name: 'MangaDex', seriesId: t.id }] },
      {
        href: '/series/' + encodeURIComponent(t.id) + '?source=mangadex',
        source: false,
        note: facts(t),
        badge: /^completed$/i.test(t.status || '') ? 'Completed' : null,
      },
    );
    node.title = t.title;
    return node;
  }

  $('meta').textContent = 'Asking MangaDex…';
  try {
    const query = 'id=' + encodeURIComponent(id) + (adult ? '&adult=1' : '');
    const url = kind === 'author' ? '/api/catalog/author?' + query : '/api/catalog/alike?' + query + '&limit=100';
    const response = await fetch(url);
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();
    const rows = data.series || data.similar || [];

    if (kind === 'author') heading('More from', data.name || name || 'this author', '');
    else heading('You might like', 'Like ' + ((data.matched && data.matched.title) || name || 'this title'), (data.because || []).join(' · '));

    if (!rows.length) {
      fail(kind === 'author'
        ? 'MangaDex files nothing else under this name.'
        : 'Nothing close enough to this title in the catalogue today.');
      return;
    }
    $('meta').textContent = rows.length + (rows.length === 1 ? ' title' : ' titles') + ' · MangaDex';
    const frag = document.createDocumentFragment();
    for (const t of rows) frag.append(tile(t));
    $('results').append(frag);
  } catch (error) {
    fail('Could not reach the catalogue. ' + (error && error.message ? error.message : ''));
  }
})();
</script>
</body>
</html>
