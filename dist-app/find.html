<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover" />
  <meta name="theme-color" content="#0b0d12" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Yomu · Search</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/_expo/static/css/glass-b8012aec7a06ecd6e8c5e04e9e0a7b17.css" />
  <style>
    body{margin:0;background:var(--bg);color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
         -webkit-tap-highlight-color:transparent}
    .wrap{max-width:720px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 16px 120px}

    .bar{display:flex;align-items:center;gap:10px}
    .back{flex:none;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);
          background:var(--surface);color:var(--text);font-size:18px;line-height:1;cursor:pointer}
    .field{flex:1;position:relative}
    .field input{width:100%;box-sizing:border-box;background:var(--surface);color:var(--text);
                 border:1px solid var(--line);border-radius:999px;padding:12px 40px 12px 16px;
                 font:inherit;font-size:16px}
    .field input::placeholder{color:var(--faint)}
    .field .spin{position:absolute;right:14px;top:50%;width:14px;height:14px;margin-top:-7px;
                 border:2px solid var(--accentLine);border-top-color:transparent;border-radius:999px;
                 animation:sp .7s linear infinite;display:none}
    .busy .field .spin{display:block}
    @keyframes sp{to{transform:rotate(360deg)}}

    .meta{color:var(--dim);font-size:12.5px;margin:14px 2px 4px;min-height:16px}
    .meta b{color:var(--muted);font-weight:600}

    .hit{display:flex;gap:12px;align-items:center;width:100%;text-align:left;
         padding:10px 6px;border:0;border-top:1px solid var(--hairline);
         background:none;color:inherit;font:inherit;cursor:pointer}
    .hit:first-of-type{border-top:0}
    .hit:active{background:var(--accentSoft)}

    .cover{flex:none;width:52px;height:74px;border-radius:8px;overflow:hidden;
           background:var(--raised);position:relative}
    .cover img{width:100%;height:100%;object-fit:cover;display:block}
    /* An adult cover is blurred even once 18+ is allowed -- allowing the
       content is not the same as wanting it on screen in public. One tap
       clears that cover for the rest of the session. */
    /* Light enough that colour and composition still read -- you can tell what
       you are looking at and whether you want it -- without the detail. */
    .cover.veiled img{filter:blur(5px);transform:scale(1.08)}
    .cover.veiled::after{content:"18+";position:absolute;right:3px;bottom:3px;
                         font-size:9px;font-weight:700;letter-spacing:.04em;line-height:1;
                         padding:3px 4px;border-radius:4px;
                         color:var(--warn);background:var(--scrim)}

    .body{flex:1;min-width:0}
    .title{font-size:15px;font-weight:600;line-height:1.3;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
    .srcs{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
    .src{font-size:11.5px;color:var(--dim);border:1px solid var(--line);border-radius:999px;
         padding:2px 8px;background:none;font-family:inherit;cursor:pointer;white-space:nowrap}
    .src:hover,.src:focus-visible{color:var(--text);border-color:var(--accentLine)}
    .src.off{opacity:.5}
    .extra{font-size:11.5px;color:var(--faint);padding:2px 4px}

    .empty{color:var(--muted);font-size:14px;line-height:1.6;padding:32px 4px;text-align:center}
    .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

    .foot{position:fixed;left:0;right:0;bottom:0;background:var(--glass);
          backdrop-filter:blur(18px);border-top:1px solid var(--hairline);
          padding:10px 16px calc(10px + env(safe-area-inset-bottom));
          display:flex;align-items:center;justify-content:space-between;gap:12px}
    .adult{display:flex;align-items:center;gap:9px;color:var(--muted);font-size:13px;cursor:pointer}
    .adult input{width:18px;height:18px;accent-color:var(--accent);margin:0}
    .foot a{color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);
            border-radius:999px;padding:7px 13px}
    .hidden{display:none!important}
  </style>
<link rel="stylesheet" href="/yomu-overrides.css"></head>
<body>
<main class="wrap" id="wrap">
  <div class="bar">
    <button class="back" id="back" aria-label="Back">‹</button>
    <div class="field">
      <input id="q" type="search" autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="Search every source…" aria-label="Search titles" />
      <span class="spin" aria-hidden="true"></span>
    </div>
  </div>

  <p class="meta" id="meta"></p>
  <div id="results"></div>

  <div class="empty" id="empty">
    <b>One title, every source.</b>
    Search by English, or by a romanised Japanese, Korean or Chinese name —
    “Kimetsu no Yaiba” finds Demon Slayer wherever it is carried.
  </div>
</main>

<div class="foot">
  <label class="adult"><input type="checkbox" id="adult" /><span>Show 18+</span></label>
  <a href="/sources">Sources</a>
</div>

<script>
(() => {
  'use strict';
  const COLLECTION_KEY = 'yomu.v1.collection';
  const ADULT_KEY = 'yomu.v1.adult';

  try { document.documentElement.dataset.mode = localStorage.getItem('yomu.appearance') || 'dark'; } catch {}

  const $ = (id) => document.getElementById(id);
  const adultOn = () => { try { return localStorage.getItem(ADULT_KEY) === 'on'; } catch { return false; } };

  /* --- provider id -> the source id this device actually has ------------- */

  // The catalog names providers its own way; the app addresses sources by the
  // id they carry in the saved collection. Same source, two vocabularies.
  const appSourceId = (providerId) =>
    providerId.startsWith('ext:')      ? 'yomuext-' + providerId.slice(4)
    : providerId.startsWith('suwayomi:') ? 'mihon-'  + providerId.slice(9)
    : providerId;

  function enabledSourceIds() {
    try {
      const raw = JSON.parse(localStorage.getItem(COLLECTION_KEY) || 'null');
      const list = Array.isArray(raw?.sources) ? raw.sources : [];
      const ids = new Set(list.filter((s) => s.enabled !== false).map((s) => String(s.id)));
      // MangaDex is built in and is not always written to the collection.
      ids.add('mangadex');
      return ids;
    } catch { return new Set(['mangadex']); }
  }

  const open = (seriesId, sourceId) => {
    location.href = `/series/${encodeURIComponent(seriesId)}?source=${encodeURIComponent(sourceId)}`;
  };

  /* --- rendering --------------------------------------------------------- */

  const MAX_CHIPS = 4;

  function render(payload, query) {
    const results = $('results');
    const entries = payload.series ?? [];
    results.textContent = '';
    $('empty').classList.toggle('hidden', entries.length > 0 || !!query);

    if (query && !entries.length) {
      $('meta').innerHTML = `Nothing for <b>${escapeHtml(query)}</b> across ${payload.providersTotal ?? 0} sources.`;
      return;
    }
    if (!query) { $('meta').textContent = ''; return; }

    const alsoLine = payload.alsoSearched
      ? ` · also searched <b>${escapeHtml(payload.alsoSearched)}</b>`
      : '';
    $('meta').innerHTML =
      `<b>${entries.length}</b> title${entries.length === 1 ? '' : 's'} across ` +
      `${payload.providersTried ?? 0} of ${payload.providersTotal ?? 0} sources${alsoLine}`;

    const have = enabledSourceIds();

    for (const entry of entries) {
      const row = document.createElement('button');
      row.className = 'hit';
      row.type = 'button';

      // Prefer a source this device has switched on; the catalog already put
      // the best-ranked provider first among them.
      const ranked = [...entry.providers].sort((a, b) => {
        const ha = have.has(appSourceId(a.id)) ? 0 : 1;
        const hb = have.has(appSourceId(b.id)) ? 0 : 1;
        return ha - hb;
      });
      const best = ranked[0];

      const cover = document.createElement('div');
      // With 18+ off the catalog filtered these out entirely, so anything
      // adult reaching here arrived because the reader asked for it -- and is
      // still blurred until they say so per cover.
      cover.className = 'cover' + (entry.nsfw ? ' veiled' : '');
      if (entry.cover) {
        const img = document.createElement('img');
        img.src = entry.cover;
        img.alt = '';
        img.loading = 'lazy';
        img.decoding = 'async';
        cover.append(img);
      }
      if (cover.classList.contains('veiled')) {
        cover.addEventListener('click', (e) => {
          e.stopPropagation();           // reveal, do not open
          cover.classList.remove('veiled');
        });
      }

      const body = document.createElement('div');
      body.className = 'body';
      const title = document.createElement('div');
      title.className = 'title';
      title.textContent = entry.title;

      const srcs = document.createElement('div');
      srcs.className = 'srcs';
      for (const p of ranked.slice(0, MAX_CHIPS)) {
        const chip = document.createElement('button');
        chip.type = 'button';
        chip.className = 'src' + (have.has(appSourceId(p.id)) ? '' : ' off');
        chip.textContent = p.name;
        chip.title = have.has(appSourceId(p.id)) ? `Read on ${p.name}` : `${p.name} — not enabled on this device`;
        chip.addEventListener('click', (e) => { e.stopPropagation(); open(p.seriesId, appSourceId(p.id)); });
        srcs.append(chip);
      }
      if (ranked.length > MAX_CHIPS) {
        const more = document.createElement('span');
        more.className = 'extra';
        more.textContent = `+${ranked.length - MAX_CHIPS}`;
        srcs.append(more);
      }

      body.append(title, srcs);
      row.append(cover, body);
      row.addEventListener('click', () => open(best.seriesId, appSourceId(best.id)));
      results.append(row);
    }
  }

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  /* --- searching --------------------------------------------------------- */

  let inFlight = null;
  let timer = null;
  let lastQuery = '';

  async function search(query) {
    lastQuery = query;
    if (!query) {
      inFlight?.abort();
      $('wrap').classList.remove('busy');
      render({ series: [] }, '');
      history.replaceState(null, '', '/find.html');
      return;
    }

    inFlight?.abort();
    const controller = new AbortController();
    inFlight = controller;
    $('wrap').classList.add('busy');
    history.replaceState(null, '', `/find.html?q=${encodeURIComponent(query)}`);

    try {
      const url = `/api/catalog/search?q=${encodeURIComponent(query)}${adultOn() ? '&adult=1' : ''}`;
      const res = await fetch(url, { signal: controller.signal });
      const payload = await res.json();
      if (controller.signal.aborted || query !== lastQuery) return;
      if (!res.ok) throw new Error(payload?.error || `HTTP ${res.status}`);
      render(payload, query);
    } catch (err) {
      if (err?.name === 'AbortError') return;
      $('results').textContent = '';
      $('meta').textContent = `Search failed: ${err?.message ?? err}`;
    } finally {
      if (inFlight === controller) {
        inFlight = null;
        $('wrap').classList.remove('busy');
      }
    }
  }

  // Every source is queried per keystroke, so the debounce is generous.
  $('q').addEventListener('input', (e) => {
    clearTimeout(timer);
    const value = e.target.value.trim();
    timer = setTimeout(() => search(value), 420);
  });
  $('q').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    clearTimeout(timer);
    e.target.blur();
    search(e.target.value.trim());
  });

  $('back').addEventListener('click', () => {
    if (history.length > 1) history.back(); else location.href = '/';
  });

  $('adult').addEventListener('change', (e) => {
    try { localStorage.setItem(ADULT_KEY, e.target.checked ? 'on' : 'off'); } catch {}
    if (lastQuery) search(lastQuery);
  });

  /* --- boot -------------------------------------------------------------- */

  $('adult').checked = adultOn();
  const initial = new URLSearchParams(location.search).get('q') ?? '';
  if (initial) { $('q').value = initial; search(initial); }
  else if (matchMedia('(min-width: 768px)').matches) $('q').focus();
})();
</script>
</body>
</html>
