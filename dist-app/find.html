  <title>Yomu · Search</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="stylesheet" href="/_expo/static/css/glass-b8012aec7a06ecd6e8c5e04e9e0a7b17.css" />
  <style>
    body{margin:0;background:var(--bg);color:var(--text);
         font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
         -webkit-tap-highlight-color:transparent}
    /* Six 2:3 tiles at 12px gaps need room; the kit shells at 1600px, and the
       search bar is capped separately so it does not stretch across it. */
    .wrap{max-width:1240px;margin:0 auto;padding:calc(14px + env(safe-area-inset-top)) 20px 120px}
    .bar{max-width:760px}

    .bar{display:flex;align-items:center;gap:10px}
    .back{flex:none;width:38px;height:38px;border-radius:999px;border:1px solid var(--line);
          background:var(--surface);color:var(--text);font-size:18px;line-height:1;cursor:pointer}
    .field{flex:1;position:relative}
    .field input{width:100%;box-sizing:border-box;background:var(--surface);color:var(--text);
                 border:1px solid var(--line);border-radius:999px;padding:12px 40px 12px 16px;
                 font:inherit;font-size:16px}
    .field input::placeholder{color:var(--faint)}
    .field .spin{position:absolute;right:14px;top:50%;width:14px;height:14px;margin-top:-7px;
                 border:2px solid var(--accentLine);border-top-color:transparent;border-radius:999px;
                 animation:sp .7s linear infinite;display:none}
    .busy .field .spin{display:block}
    @keyframes sp{to{transform:rotate(360deg)}}

    .meta{color:var(--dim);font-size:12.5px;margin:14px 2px 4px;min-height:16px}
    /* Results no enabled source can open get their own line rather than
       sitting dimmed among the ones you can read. Comick alone accounted for
       25 of the 73 rows on a search for "dandadan" -- it can find a title but
       not serve a page, so those rows were noise sitting in the good ones. */
    .shelf-line{grid-column:1/-1;display:flex;align-items:center;gap:10px;
      margin:20px 2px 2px;color:var(--dim);font-size:11px;
      letter-spacing:.08em;text-transform:uppercase}
    .shelf-line::after{content:'';flex:1;height:1px;background:var(--line)}
    .meta b{color:var(--muted);font-weight:600}

    /* --- tile grid, per YOMU_implementation_kit docs/IMPLEMENTATION.md ---
       Six columns on wide desktop, four below 1100px, two on a phone; 2:3
       covers with 12px corners and 12px gaps. The tile stack is cover ->
       softly blurred dark lower edge -> sharp bottom gradient -> copy ->
       badges, so the artwork blurs at its edge while the text over it stays
       sharp. */
    .grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px;margin-top:4px}

    .tile{position:relative;isolation:isolate;overflow:hidden;aspect-ratio:2/3;
          border:1px solid var(--line);border-radius:12px;background:#172531;
          min-width:0;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;
          transition:border-color .15s,transform .15s}
    .tile:hover{border-color:#b5c9df60;transform:translateY(-2px)}
    .tile:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
    .tile[disabled]{cursor:default;opacity:.55}
    .tile[disabled]:hover{transform:none;border-color:var(--line)}

    .tile-art{position:absolute;inset:0;z-index:-3;
              background:linear-gradient(145deg,#567591,#141d30)}
    .tile-art img{width:100%;height:100%;object-fit:cover;display:block}
    /* Blurred dark lower edge, then the sharp gradient the copy sits on. */
    /* Kept to the lower third, the same as the home grid's tiles. */
    .tile::before{content:"";position:absolute;inset:68% -12px -12px;z-index:-2;
                  background:#101a25b3;filter:blur(18px);pointer-events:none}
    .tile::after{content:"";position:absolute;inset:0;z-index:-1;pointer-events:none;
                 background:linear-gradient(180deg,#07101922 0,transparent 60%,
                            #0c151b70 80%,#0c151bf5 100%)}

    .tile-copy{position:absolute;bottom:10px;left:10px;right:10px}
    .tile-copy .t{font-size:12px;font-weight:650;line-height:1.3;
                  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
                  overflow:hidden}
    /* The sources a title is carried by, which is what this search is for. */
    .tile-copy small{display:block;margin-top:4px;font-size:11px;color:var(--muted);
                     white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

    /* Badges use the assets' intrinsic proportions -- height is set, width is
       auto, never one axis stretched. A second badge stacks below the first. */
    .tags{position:absolute;top:6px;left:6px;right:6px;z-index:2;
          display:flex;flex-direction:column;align-items:flex-start;gap:4px;pointer-events:none}
    .tags img{height:22px;width:auto;max-width:100%;object-fit:contain;object-position:left top}


    /* --- the resting state: history and feed rows --- */
    .lede{color:var(--muted);font-size:13.5px;line-height:1.6;margin:16px 2px 0;max-width:640px}
    #suggest h2{font-size:15px;font-weight:650;margin:22px 2px 10px;letter-spacing:-.01em}
    .chips{display:flex;flex-wrap:wrap;gap:8px}
    .chip{display:inline-flex;align-items:center;border:1px solid var(--line);
          border-radius:999px;background:var(--surface);overflow:hidden}
    .chip:hover{border-color:var(--accentLine)}
    .chip__go{border:0;background:none;color:var(--text);font:inherit;font-size:13px;
              padding:9px 4px 9px 14px;cursor:pointer;max-width:240px;
              white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .chip__x{border:0;background:none;color:var(--faint);font:inherit;font-size:15px;
             line-height:1;padding:9px 12px 9px 6px;cursor:pointer}
    .chip__x:hover{color:var(--bad)}
    .feed .grid{margin-top:0}
    .empty{color:var(--muted);font-size:14px;line-height:1.6;padding:32px 4px;text-align:center}
    .empty b{display:block;color:var(--text);font-size:15px;margin-bottom:6px}

    .foot{position:fixed;left:0;right:0;bottom:0;background:var(--glass);
          backdrop-filter:blur(18px);border-top:1px solid var(--hairline);
          padding:10px 16px calc(10px + env(safe-area-inset-bottom));
          display:flex;align-items:center;justify-content:space-between;gap:12px}
    .footnote{color:var(--dim);font-size:12.5px}
    .foot a{color:var(--muted);font-size:13px;text-decoration:none;border:1px solid var(--line);
            border-radius:999px;padding:7px 13px}
    .hidden{display:none!important}

    @media(max-width:1100px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
    @media(max-width:767px){
      .wrap{padding-left:16px;padding-right:16px}
      .grid{grid-template-columns:repeat(2,minmax(0,1fr))}
      .tile-copy .t{font-size:13px}
      .field input{min-height:44px}
      .foot a,.adult{min-height:44px}
    }
    @media(prefers-reduced-motion:reduce){.tile{transition:none}}
  
    /* browse by genre, and the charts */
    .genres { margin-top: 26px; }
    .genres h2 { margin: 0 0 12px; font-size: 17px; font-weight: 800; letter-spacing: -.02em; }
    .genre-tiles { display: flex; flex-wrap: wrap; gap: 8px; }
    .genre-tile {
      border: 1px solid var(--line); background: var(--surface); color: var(--text);
      border-radius: 999px; padding: 9px 15px; min-height: 40px; cursor: pointer;
      font: 600 13px/1 var(--uiFont); transition: background .18s, border-color .18s;
    }
    .genre-tile:hover { background: var(--raised); border-color: var(--accentLine); }
    .genre-tile:active { transform: scale(.97); }
    .genre-tiles { flex-wrap: nowrap; }
    .genre-tile--more {
      display: inline-flex; align-items: center; gap: 8px;
      border-style: dashed; color: var(--muted); font-weight: 600; white-space: nowrap;
    }
    .genre-more { position: relative; display: inline-block; }
    .genre-caret {
      width: 6px; height: 6px; flex: none;
      border-right: 1.5px solid currentColor; border-bottom: 1.5px solid currentColor;
      transform: translateY(-2px) rotate(45deg);
      transition: transform .2s cubic-bezier(.32,.72,0,1);
    }
    .genre-more.is-open .genre-caret { transform: translateY(1px) rotate(-135deg); }
    .genre-menu {
      position: absolute; z-index: 30; top: calc(100% + 6px); right: 0;
      min-width: 180px; max-height: 320px; overflow-y: auto; padding: 6px;
      border: 1px solid var(--line); border-radius: 14px;
      /* --surface is a lift, not a ground: on its own the menu is a window
         onto the cover grid underneath. The page background is the opaque
         one, with surface layered over it the way every raised thing here
         is composed. */
      background-color: var(--bg);
      background-image: linear-gradient(var(--surface), var(--surface));
      box-shadow: 0 18px 44px #0000003d;
      opacity: 0; visibility: hidden; transform: translateY(-4px);
      transition: opacity .16s ease, transform .18s cubic-bezier(.23,1,.32,1), visibility .18s;
    }
    .genre-more.is-open .genre-menu { opacity: 1; visibility: visible; transform: none; }
    .genre-option {
      display: block; width: 100%; padding: 9px 10px; border: 0; border-radius: 9px;
      background: none; color: var(--text); font: 500 13px/1.2 var(--uiFont);
      text-align: left; cursor: pointer;
    }
    .genre-option:hover { background: var(--raised); }
    @media (prefers-reduced-motion: reduce) {
      .genre-menu, .genre-caret { transition: none; }
    }
    .genre-note { margin: 11px 2px 0; font-size: 12px; color: var(--faint); line-height: 1.5; }

    .charts { display: flex; gap: 6px; margin: 30px 0 14px; }
    .charts button {
      border: 1px solid var(--line); background: none; color: var(--dim);
      border-radius: 999px; padding: 8px 16px; min-height: 40px; cursor: pointer;
      font: 700 13px/1 var(--uiFont);
    }
    .charts button[aria-selected='true'] {
      background: var(--accentSoft); border-color: var(--accentLine); color: var(--accent);
    }
    .charts.hidden, .genres.hidden { display: none; }
    /* The chart heading is the tab now. */
    .charts:not(.hidden) ~ .feed > h2 { display: none; }

  </style>

<body>
<main class="wrap" id="wrap">
  <div class="bar">
    <button class="back" id="back" aria-label="Back">‹</button>
    <div class="field">
      <input id="q" type="search" autocomplete="off" autocapitalize="off" autocorrect="off"
             spellcheck="false" placeholder="Search every source…" aria-label="Search titles" />
      <span class="spin" aria-hidden="true"></span>
    </div>
  </div>

  <p class="meta" id="meta"></p>
  <div id="results" class="grid"></div>

  <div id="suggest">
    <p class="lede">Search by English, or by a romanised Japanese, Korean or Chinese name —
      “Kimetsu no Yaiba” finds Demon Slayer wherever it is carried.</p>
    <section id="history" class="hidden"></section>

    <!-- Rankings, above browsing by genre: "what is good right now" is a
         better first question than "which genre am I in the mood for", and
         the tabs below it are the only place Manga / Manhwa / Manhua is a
         real distinction rather than a guess at a source's category. -->
    <section id="yomu-rails-here"></section>
    <section id="genres" class="genres hidden">
      <h2>Browse by genre</h2>
      <div class="genre-tiles" id="genre-tiles"></div>
      <p class="genre-note">Genres come from MangaDex, the one source here that files titles by tag.</p>
    </section>
    <div class="charts hidden" id="charts" role="tablist" aria-label="Charts"></div>
    <section id="feed-popular" class="feed hidden"></section>
    <section id="feed-latest" class="feed hidden"></section>
  </div>
</main>

<div class="foot">
  <span class="footnote">Search covers every enabled source.</span>
  <a href="/sources">Sources</a>
</div>

<script>
(async () => {
  'use strict';
  const COLLECTION_KEY = 'yomu.v1.collection';

  try { document.documentElement.dataset.mode = localStorage.getItem('yomu.appearance') || 'light'; } catch {}

  const $ = (id) => document.getElementById(id);

  /* --- provider id -> the source id this device actually has ------------- */

  // The catalog names providers its own way; the app addresses sources by the
  // id they carry in the saved collection. Same source, two vocabularies.
  const appSourceId = (providerId) =>
    providerId.startsWith('ext:')      ? 'yomuext-' + providerId.slice(4)
    : providerId.startsWith('suwayomi:') ? 'mihon-'  + providerId.slice(9)
    : providerId;

  /**
   * Extensions that cannot serve pages, by id.
   *
   * Comick is discovery-only by design: it has the best metadata and the widest
   * catalog, which is exactly why it turns up as a title's first provider, but
   * asking it for a chapter is a 502. A source that cannot be read must never be
   * what a row opens.
   */
  const readOnlyMeta = new Set();
  async function learnCapabilities() {
    try {
      const res = await fetch('/api/ext/sources');
      const body = await res.json();
      for (const e of body.extensions ?? []) {
        if (!e.capabilities?.pages) readOnlyMeta.add('yomuext-' + e.id);
      }
    } catch {
      // Not knowing is survivable: ranking falls back to the catalog's order.
    }
  }
  const canRead = (appId) => !readOnlyMeta.has(appId);
  /** Whether anything carrying this title can actually serve a page of it. */
  const canOpen = (entry) => (entry.providers ?? []).some((p) => canRead(appSourceId(p.id)));

  function enabledSourceIds() {
    try {
      const raw = JSON.parse(localStorage.getItem(COLLECTION_KEY) || 'null');
      const list = Array.isArray(raw?.sources) ? raw.sources : [];
      const ids = new Set(list.filter((s) => s.enabled !== false).map((s) => String(s.id)));
      // MangaDex is built in and is not always written to the collection.
      ids.add('mangadex');
      return ids;
    } catch { return new Set(['mangadex']); }
  }

  const open = (seriesId, sourceId) => {
    location.href = `/series/${encodeURIComponent(seriesId)}?source=${encodeURIComponent(sourceId)}`;
  };

  /* --- rendering --------------------------------------------------------- */

  /**
   * Which status badges a title has earned.
   *
   * Only what a provider actually reports. Hottest, Newest and Most Popular are
   * in the asset set and deliberately unused: no source here publishes a
   * ranking or an added-date, and the app already refuses to invent one
   * ("This source publishes no ranking signal, and none is invented here").
   * Mature is orthogonal to update status, so it leads and an update badge
   * stacks below it.
   */
  const NEW_CHAPTER_WINDOW_MS = 7 * 24 * 60 * 60 * 1000;

  function badgesFor(entry) {
    const out = [];
    if (/complete|finished/i.test(entry.status ?? '')) {
      out.push({ src: '/tags/completed.svg', alt: 'Completed' });
    } else if (entry.updatedAt && Date.now() - entry.updatedAt < NEW_CHAPTER_WINDOW_MS) {
      out.push({ src: '/tags/new-chapter.svg', alt: 'New chapter' });
    }
    return out;
  }

  /** One result tile. Shared by search results and the suggestion rows. */
  function buildTile(entry, have) {
    // Readable first, then enabled on this device; the catalog already put
    // the best-ranked provider first within each group.
    const rank = (p) => {
      const id = appSourceId(p.id);
      return (canRead(id) ? 0 : 2) + (have.has(id) ? 0 : 1);
    };
    const ranked = [...entry.providers].sort((a, b) => rank(a) - rank(b));
    const best = ranked[0];
    const readable = canRead(appSourceId(best.id));

    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'tile';

    const art = document.createElement('div');
    art.className = 'tile-art';
    if (entry.cover) {
      const img = document.createElement('img');
      img.src = entry.cover;
      // The adjacent title supplies the accessible name.
      img.alt = '';
      img.loading = 'lazy';
      img.decoding = 'async';
      art.append(img);
    }

    const tags = document.createElement('div');
    tags.className = 'tags';
    for (const badge of badgesFor(entry)) {
      const img = document.createElement('img');
      img.src = badge.src;
      img.alt = badge.alt;
      tags.append(img);
    }

    const copy = document.createElement('div');
    copy.className = 'tile-copy';
    const title = document.createElement('span');
    title.className = 't';
    title.textContent = entry.title;
    const sources = document.createElement('small');
    sources.textContent = ranked.map((p) => p.name).join(' · ');
    sources.title = sources.textContent;
    copy.append(title, sources);

    tile.append(art, tags, copy);

    if (readable) {
      tile.addEventListener('click', () => open(best.seriesId, appSourceId(best.id)));
      tile.title = `${entry.title} — read on ${best.name}`;
    } else {
      tile.disabled = true;
      tile.title = `${entry.title} — no enabled source can serve this title yet`;
    }
    return tile;
  }

  function render(payload, query) {
    const results = $('results');
    const entries = payload.series ?? [];
    results.textContent = '';
    // Suggestions are the resting state; results replace them.
    $('suggest').classList.toggle('hidden', !!query);

    if (query && !entries.length) {
      $('meta').innerHTML = `Nothing for <b>${escapeHtml(query)}</b> across ${payload.providersTotal ?? 0} sources.`;
      return;
    }
    if (!query) { $('meta').textContent = ''; return; }

    /* Split before counting. A search that turns up 73 titles of which only
       48 can be opened has found 48 titles and a footnote, and saying 73 sets
       up the disappointment. */
    const readable = [];
    const shelved = [];
    for (const entry of entries) (canOpen(entry) ? readable : shelved).push(entry);

    const alsoLine = payload.alsoSearched
      ? ` · also searched <b>${escapeHtml(payload.alsoSearched)}</b>`
      : '';
    $('meta').innerHTML =
      `<b>${readable.length}</b> title${readable.length === 1 ? '' : 's'} across ` +
      `${payload.providersTried ?? 0} of ${payload.providersTotal ?? 0} sources${alsoLine}`;

    const have = enabledSourceIds();
    for (const entry of readable) results.append(buildTile(entry, have));

    /* Kept, not dropped: knowing a title exists somewhere Yomu cannot reach
       yet is worth something -- it is the reason to add a source. It just
       does not belong above the titles you can open. */
    if (shelved.length) {
      const line = document.createElement('p');
      line.className = 'shelf-line';
      line.textContent = shelved.length === 1
        ? '1 more found · no source can open it yet'
        : `${shelved.length} more found · no source can open them yet`;
      results.append(line);
      for (const entry of shelved) results.append(buildTile(entry, have));
    }
  }

  /* --- the resting state ------------------------------------------------- *
   *
   * An empty search page is a dead end, so it carries what you searched before
   * and two rows drawn from the catalog's own feeds. These are real orderings,
   * not invented ones: "popular" is each provider's own popular endpoint --
   * MangaDex by follower count, Comick by follows -- and "updated" is ordered
   * by the latest uploaded chapter. After merging, neither is a global ranking,
   * so they are labelled for what they are.
   * -------------------------------------------------------------------- */

  const HISTORY_KEY = 'yomu.v1.searchHistory';
  const HISTORY_MAX = 8;

  const history = () => {
    try {
      const raw = JSON.parse(localStorage.getItem(HISTORY_KEY) || '[]');
      return Array.isArray(raw) ? raw.filter((s) => typeof s === 'string').slice(0, HISTORY_MAX) : [];
    } catch { return []; }
  };
  const remember = (query) => {
    try {
      const next = [query, ...history().filter((h) => h.toLowerCase() !== query.toLowerCase())];
      localStorage.setItem(HISTORY_KEY, JSON.stringify(next.slice(0, HISTORY_MAX)));
    } catch {}
  };
  const forget = (query) => {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(history().filter((h) => h !== query)));
    } catch {}
  };

  function renderHistory() {
    const box = $('history');
    const items = history();
    box.textContent = '';
    box.classList.toggle('hidden', !items.length);
    if (!items.length) return;

    const heading = document.createElement('h2');
    heading.textContent = 'Recent searches';
    box.append(heading);

    const row = document.createElement('div');
    row.className = 'chips';
    for (const item of items) {
      const chip = document.createElement('span');
      chip.className = 'chip';

      const go = document.createElement('button');
      go.type = 'button';
      go.className = 'chip__go';
      go.textContent = item;
      go.addEventListener('click', () => { $('q').value = item; search(item); });

      const drop = document.createElement('button');
      drop.type = 'button';
      drop.className = 'chip__x';
      drop.setAttribute('aria-label', `Forget "${item}"`);
      drop.textContent = '×';
      drop.addEventListener('click', () => { forget(item); renderHistory(); });

      chip.append(go, drop);
      row.append(chip);
    }
    box.append(row);
  }

  /**
   * Where in the feed to start showing, this visit.
   *
   * Both feeds come back merged and long -- popular is 244 titles -- and the
   * page was showing the first twelve of them, every time, forever. The other
   * 232 were fetched and thrown away. So the window moves along by a rowful
   * each visit and wraps at the end: the same real ordering, a different part
   * of it, and not one extra request to get it.
   */
  const ROTATE_KEY = 'yomu.v1.feedTurn';
  const turn = (() => {
    let n = 0;
    try { n = (Number(localStorage.getItem(ROTATE_KEY)) || 0) + 1; } catch {}
    try { localStorage.setItem(ROTATE_KEY, String(n % 1000)); } catch {}
    return n;
  })();

  /** Twelve from `all`, starting a rowful further along on each visit. */
  function slice(all, step, size = 12) {
    if (all.length <= size) return all;
    const start = ((turn * size * step) % all.length + all.length) % all.length;
    const out = all.slice(start, start + size);
    // Wrap rather than return a short row at the end of the list.
    if (out.length < size) out.push(...all.slice(0, size - out.length));
    return out;
  }

  async function renderFeeds() {
    const have = enabledSourceIds();
    const rows = [
      { id: 'feed-popular', title: 'Popular on your sources', url: '/api/catalog/popular', step: 1 },
      // Stepped differently so the two rows do not travel in lockstep.
      { id: 'feed-latest', title: 'New chapters', url: '/api/catalog/latest', step: 2 },
    ];

    await Promise.all(rows.map(async ({ id, title, url, step }) => {
      const box = $(id);
      try {
        const payload = await (await fetch(url, { signal: AbortSignal.timeout(25000) })).json();
        const entries = slice(payload.series || [], step);
        if (!entries.length) return;
        box.textContent = '';
        const heading = document.createElement('h2');
        heading.textContent = title;
        const grid = document.createElement('div');
        grid.className = 'grid';
        for (const entry of entries) grid.append(buildTile(entry, have));
        box.append(heading, grid);
        box.classList.remove('hidden');
      } catch {
        // A feed that will not load simply is not offered.
      }
    }));
  }

  const escapeHtml = (s) =>
    String(s).replace(/[&<>"']/g, (c) => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

  /* --- browse ------------------------------------------------------------ */

  const ADULT_KEY = 'yomu.v1.adult';
  const adultQs = () => {
    try { return localStorage.getItem(ADULT_KEY) === 'on' ? '&adult=1' : ''; } catch { return ''; }
  };

  /**
   * Genres, which are not search terms.
   *
   * Asking any source for "Isekai" returns the titles with Isekai in the name
   * -- 103 of them -- rather than the isekai titles. Only MangaDex files by
   * tag, so these tiles go to /api/catalog/tag, and the note under them says
   * where the answers come from rather than implying every source was asked.
   */
  /** What people come to a genre list for, ahead of what the alphabet offers. */
  const GENRES_FIRST = ['Action', 'Romance', 'Fantasy'];
  const GENRES_SHOWN = 3;

  async function renderGenres() {
    const box = $('genre-tiles');
    if (!box) return;
    try {
      const payload = await (await fetch('/api/catalog/tags', { signal: AbortSignal.timeout(20000) })).json();
      const genres = (payload.tags || [])
        .filter((tag) => tag.group === 'genre')
        .sort((a, b) => a.name.localeCompare(b.name));
      if (!genres.length) return;

      /* Twenty-five pills in a wrapped row is seven rows of them on a phone,
         and alphabetical order makes the first eight arbitrary -- Boys' Love
         and Crime ahead of Romance and Fantasy. So the ones people actually
         come here to browse lead, the rest follow in their own order behind a
         count, and the section is a section again rather than a wall. */
      const lead = GENRES_FIRST.filter((name) => genres.some((g) => g.name === name));
      const rest = genres.map((g) => g.name).filter((name) => !lead.includes(name));
      const ordered = [...lead, ...rest];

      box.textContent = '';

      // Three shortcuts and a menu, on one line. Expanding in place was still
      // three rows of pills once it opened, which is the same wall arriving
      // a tap later.
      for (const name of ordered.slice(0, GENRES_SHOWN)) {
        const tile = document.createElement('button');
        tile.type = 'button';
        tile.className = 'genre-tile';
        tile.textContent = name;
        tile.addEventListener('click', () => browseGenre(name));
        box.append(tile);
      }

      const others = ordered.slice(GENRES_SHOWN);
      // One genre behind a menu that exists to hold one genre is worse than
      // the genre.
      if (others.length >= 2) box.append(genreMenu(others));

      $('genres').classList.remove('hidden');
    } catch {
      // A genre list that will not load simply is not offered.
    }
  }

  /**
   * The rest of the genres, as a menu rather than more pills.
   *
   * Closes on a click anywhere outside it and on Escape, both bound to the
   * document once per menu built -- this runs once on load, so there is no
   * accumulation to clean up.
   */
  function genreMenu(names) {
    const wrap = document.createElement('span');
    wrap.className = 'genre-more';

    const trigger = document.createElement('button');
    trigger.type = 'button';
    trigger.className = 'genre-tile genre-tile--more';
    trigger.setAttribute('aria-haspopup', 'listbox');
    trigger.setAttribute('aria-expanded', 'false');
    trigger.append(
      document.createTextNode(names.length + ' more'),
      Object.assign(document.createElement('i'), { className: 'genre-caret' }),
    );

    const menu = document.createElement('div');
    menu.className = 'genre-menu';
    menu.setAttribute('role', 'listbox');

    const close = () => {
      wrap.classList.remove('is-open');
      trigger.setAttribute('aria-expanded', 'false');
    };

    trigger.addEventListener('click', (event) => {
      event.stopPropagation();
      const open = wrap.classList.toggle('is-open');
      trigger.setAttribute('aria-expanded', String(open));
    });

    for (const name of names) {
      const option = document.createElement('button');
      option.type = 'button';
      option.className = 'genre-option';
      option.setAttribute('role', 'option');
      option.textContent = name;
      option.addEventListener('click', () => { close(); browseGenre(name); });
      menu.append(option);
    }

    document.addEventListener('click', (event) => {
      if (!wrap.contains(event.target)) close();
    });
    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape') close();
    });

    wrap.append(trigger, menu);
    return wrap;
  }

  async function browseGenre(name) {
    const have = enabledSourceIds();
    const results = $('results');
    const meta = $('meta');
    $('suggest').classList.add('hidden');
    meta.textContent = 'Loading ' + name + '\u2026';
    results.textContent = '';
    try {
      const url = '/api/catalog/tag?name=' + encodeURIComponent(name) + adultQs();
      const response = await fetch(url, { signal: AbortSignal.timeout(25000) });
      const payload = await response.json();
      if (!response.ok) {
        meta.textContent = payload.error || ('Could not load ' + name + '.');
        return;
      }
      const entries = payload.series || [];
      if (!entries.length) {
        meta.textContent = 'Nothing in ' + name + ' right now.';
        return;
      }
      meta.textContent = entries.length + ' in ' + name + ' \u00b7 from MangaDex';
      for (const entry of entries) results.append(buildTile(entry, have));
    } catch {
      meta.textContent = 'Could not reach MangaDex.';
    }
  }

  /** The two feeds as charts, one at a time, rather than stacked. */
  function renderCharts() {
    const bar = $('charts');
    if (!bar) return;
    const tabs = [
      { id: 'feed-popular', label: 'Popular' },
      { id: 'feed-latest', label: 'New' },
    ];
    // Only offer the switch for feeds that actually loaded.
    const live = tabs.filter((tab) => $(tab.id) && !$(tab.id).classList.contains('hidden'));
    if (live.length < 2) return;

    bar.textContent = '';
    const show = (id) => {
      for (const tab of live) $(tab.id).classList.toggle('hidden', tab.id !== id);
      for (const button of bar.children) {
        button.setAttribute('aria-selected', String(button.dataset.feed === id));
      }
    };
    for (const tab of live) {
      const button = document.createElement('button');
      button.type = 'button';
      button.role = 'tab';
      button.dataset.feed = tab.id;
      button.textContent = tab.label;
      button.addEventListener('click', () => show(tab.id));
      bar.append(button);
    }
    bar.classList.remove('hidden');
    show(live[0].id);
  }

  /* --- searching --------------------------------------------------------- */

  let inFlight = null;
  let timer = null;
  let lastQuery = '';

  async function search(query) {
    lastQuery = query;
    if (!query) {
      inFlight?.abort();
      $('wrap').classList.remove('busy');
      render({ series: [] }, '');
      renderHistory();
      window.history.replaceState(null, '', '/find.html');
      return;
    }

    inFlight?.abort();
    const controller = new AbortController();
    inFlight = controller;
    $('wrap').classList.add('busy');
    window.history.replaceState(null, '', `/find.html?q=${encodeURIComponent(query)}`);

    try {
      // Never adult. 18+ lives on its own page, behind its own gate; nothing
      // adult is meant to surface while browsing normally.
      const url = `/api/catalog/search?q=${encodeURIComponent(query)}`;
      const res = await fetch(url, { signal: controller.signal });
      const payload = await res.json();
      if (controller.signal.aborted || query !== lastQuery) return;
      if (!res.ok) throw new Error(payload?.error || `HTTP ${res.status}`);
      render(payload, query);
      if (payload.series?.length) { remember(query); renderHistory(); }
    } catch (err) {
      if (err?.name === 'AbortError') return;
      $('results').textContent = '';
      $('meta').textContent = `Search failed: ${err?.message ?? err}`;
    } finally {
      if (inFlight === controller) {
        inFlight = null;
        $('wrap').classList.remove('busy');
      }
    }
  }

  // Every source is queried per keystroke, so the debounce is generous.
  $('q').addEventListener('input', (e) => {
    clearTimeout(timer);
    const value = e.target.value.trim();
    timer = setTimeout(() => search(value), 420);
  });
  $('q').addEventListener('keydown', (e) => {
    if (e.key !== 'Enter') return;
    clearTimeout(timer);
    e.target.blur();
    search(e.target.value.trim());
  });

  $('back').addEventListener('click', () => {
    if (history.length > 1) history.back(); else location.href = '/';
  });

  /* --- boot -------------------------------------------------------------- */

  await learnCapabilities();
  renderHistory();
  const initial = new URLSearchParams(location.search).get('q') ?? '';
  // The charts only make sense once the feeds have answered, so they are
  // built after, and only if both actually loaded.
  if (!initial) { renderGenres(); renderFeeds().then(renderCharts); }
  if (initial) { $('q').value = initial; search(initial); }
  else if (matchMedia('(min-width: 768px)').matches) $('q').focus();
})();
</script>
</body>
</html>
