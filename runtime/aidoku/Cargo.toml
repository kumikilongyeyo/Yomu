[package]
name = "yomu-aidoku-runtime"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
aidoku = { git = "https://github.com/Aidoku/aidoku-rs", rev = "b0818704a5487778999bcd11239fa4c7a44da6ab", package = "aidoku", default-features = false }
aidoku-test-runner = { git = "https://github.com/Aidoku/aidoku-rs", rev = "b0818704a5487778999bcd11239fa4c7a44da6ab", package = "aidoku-test-runner" }
anyhow = "1"
axum = { version = "0.8", features = ["json"] }
base64 = "0.22"
postcard = { version = "1.1", features = ["alloc"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
url = "2.5"
wasmer = "6.1"
zip = { version = "4", default-features = false, features = ["deflate"] }
