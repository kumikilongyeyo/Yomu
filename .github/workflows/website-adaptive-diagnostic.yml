name: Website Adaptive diagnostic

# Re-run after Yomu Source Runtime v12 Madara/challenge upgrade.
on:
  push:
    branches:
      - diagnostic/website-adaptive-20260919

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe failed sites with full diagnostics
        run: |
          node <<'NODE'
          const base = 'https://yomu.yomuread.workers.dev';
          const sites = [
            'https://www.toongod.org/',
            'https://www.mangaread.org/',
            'https://mangapark1.com/',
          ];
          for (const site of sites) {
            console.log(`\n=== ${site} ===`);
            try {
              const response = await fetch(`${base}/api/fabric/forge/test`, {
                method: 'POST',
                headers: { 'content-type': 'application/json', accept: 'application/json' },
                body: JSON.stringify({ url: site }),
                signal: AbortSignal.timeout(65000),
              });
              const text = await response.text();
              console.log(`HTTP ${response.status}`);
              try { console.log(JSON.stringify(JSON.parse(text), null, 2)); }
              catch { console.log(text.slice(0, 12000)); }
            } catch (error) {
              console.log(`ERROR ${error?.message || error}`);
            }
          }
          NODE
