name: Library UI UX and Performance 10 of 10 gate

on:
  push:
    branches:
      - feature/full-source-library-2026-09-20
      - perf/more-buttons-2x-loading-2026-09-20
    paths:
      - 'dist-app/yomu-library*'
      - 'dist-app/yomu-mori-chat*'
      - 'dist-app/yomu-mori-drag.js'
      - 'dist-app/yomu-loading-policy.js'
      - 'dist-app/yomu-performance.js'
      - 'dist-app/yomu-explore-more.js'
      - 'scripts/optimize-export.py'
      - 'tools/library-gauntlet.mjs'
      - 'tools/uiux-gauntlet.mjs'
      - 'tools/performance-gauntlet.mjs'
      - 'tools/gauntlet.mjs'
      - 'tools/search-gauntlet.mjs'
      - 'package.json'
      - '.github/workflows/library-uiux-check.yml'
  pull_request:
    paths:
      - 'dist-app/**'
      - 'scripts/optimize-export.py'
      - 'tools/library-gauntlet.mjs'
      - 'tools/uiux-gauntlet.mjs'
      - 'tools/performance-gauntlet.mjs'
      - 'package.json'

permissions:
  contents: read

jobs:
  strict-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Syntax check browser and gate code
        run: |
          node --check dist-app/yomu-library-engine.js
          node --check dist-app/yomu-library-explorer.js
          node --check dist-app/yomu-mori-drag.js
          node --check dist-app/yomu-mori-chat.js
          node --check dist-app/yomu-loading-policy.js
          node --check dist-app/yomu-performance.js
          node --check dist-app/yomu-explore-more.js
          node --check tools/library-gauntlet.mjs
          node --check tools/uiux-gauntlet.mjs
          node --check tools/performance-gauntlet.mjs
          python3 -m py_compile scripts/optimize-export.py

      - name: Optimize the exact release export
        run: python3 scripts/optimize-export.py

      - name: Worker typecheck
        run: npm run typecheck

      - name: Existing engineering release gate
        run: node tools/gauntlet.mjs --offline

      - name: Existing Search 10 of 10 gate
        run: node tools/search-gauntlet.mjs

      - name: Full-source Library 10 of 10 gate
        run: node tools/library-gauntlet.mjs

      - name: Library UI UX 10 of 10 gate
        run: node tools/uiux-gauntlet.mjs

      - name: Performance and loading 10 of 10 gate
        run: node tools/performance-gauntlet.mjs
