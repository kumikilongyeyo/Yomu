name: Universal Runtime CI

on:
  push:
    paths:
      - 'runtime/miwayomi-gateway/**'
      - '.github/workflows/universal-runtime-ci.yml'
  pull_request:
    paths:
      - 'runtime/miwayomi-gateway/**'
      - '.github/workflows/universal-runtime-ci.yml'

permissions:
  contents: read

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./runtime/miwayomi-gateway
          push: false
          tags: yomu-miwayomi-runtime:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
