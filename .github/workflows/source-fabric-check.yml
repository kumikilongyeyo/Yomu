name: Source Fabric check

on:
  push:
    branches:
      - main
      - forge-v5-source-fabric
  pull_request:
    paths:
      - 'worker/**'
      - 'dist-app/add-sources.html'
      - 'dist-app/source-import.js'
      - 'dist-app/source-fabric-panel.js'
      - 'dist-app/source-fabric-bulk.js'
      - 'dist-app/source-pack-json.js'
      - 'dist-app/source-pack-live.js'
      - 'dist-app/source-packs/**'
      - 'dist-app/source-fabric-layout.js'
      - 'dist-app/source-fabric-diagnostics.js'
      - 'dist-app/source-fabric-discover.js'
      - 'dist-app/source-auto-switch.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Check browser scripts
        run: |
          node --check dist-app/source-import.js
          node --check dist-app/source-fabric-panel.js
          node --check dist-app/source-fabric-bulk.js
          node --check dist-app/source-pack-json.js
          node --check dist-app/source-pack-live.js
          node --check dist-app/source-fabric-layout.js
          node --check dist-app/source-fabric-diagnostics.js
          node --check dist-app/source-fabric-discover.js
          node --check dist-app/source-auto-switch.js
      - name: Validate source packs
        run: |
          node -e "const fs=require('fs');const p='dist-app/source-packs/community.json';const x=JSON.parse(fs.readFileSync(p,'utf8'));if(x.schema!=='yomu.source-pack/1'||!Array.isArray(x.sources)||!x.sources.length)throw new Error('Invalid Yomu source pack');console.log(x.name+': '+x.sources.length+' sources')"
      - name: Bundle Worker
        run: npx wrangler deploy --dry-run --outdir .wrangler-dry-run
