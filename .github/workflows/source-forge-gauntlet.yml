name: Source Forge gauntlet

on:
  workflow_run:
    workflows:
      - Deploy Yomu to Cloudflare
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gauntlet:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Source Forge deployment
        run: |
          node <<'NODE'
          const url = 'https://yomu.yomuread.workers.dev/api/fabric/status';
          const minimum = [8, 2];
          const atLeast = (value, [wantMajor, wantMinor]) => {
            const [major = 0, minor = 0] = String(value || '').split('.').map((part) => Number.parseInt(part, 10) || 0);
            return major > wantMajor || (major === wantMajor && minor >= wantMinor);
          };
          for (let i = 0; i < 24; i++) {
            try {
              const r = await fetch(url, { cache: 'no-store', signal: AbortSignal.timeout(10000) });
              const x = r.ok ? await r.json() : null;
              console.log(`attempt ${i + 1}: HTTP ${r.status} version=${x?.version || '-'} forge=${!!x?.sourceForge} adaptive=${x?.websiteAdaptive?.version || '-'}`);
              if (x?.sourceForge && x?.websiteAdaptive && atLeast(x.version, minimum)) process.exit(0);
            } catch (e) {
              console.log(`attempt ${i + 1}: ${e.message}`);
            }
            await new Promise((resolve) => setTimeout(resolve, 10000));
          }
          throw new Error('Current Source Forge + Website Adaptive deployment did not become live in time.');
          NODE
      - name: Run 10-site acceptance gauntlet
        run: node scripts/source-forge-gauntlet.mjs
