name: Strict live source audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'tools/source-audit.mjs'
      - 'extensions/**'
      - 'worker/extensions/**'
      - 'worker/routes-extensions.ts'
      - '.github/workflows/source-live-audit.yml'

permissions:
  contents: read

concurrency:
  group: yomu-strict-source-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh live extension registry
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://yomu.yomuread.workers.dev/api/ext/refresh >/tmp/yomu-ext-refresh.json
          cat /tmp/yomu-ext-refresh.json
      - name: Require every active source to read end to end
        run: node tools/source-audit.mjs https://yomu.yomuread.workers.dev
