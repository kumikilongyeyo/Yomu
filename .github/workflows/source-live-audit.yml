name: Strict live source audit

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Deploy Yomu to Cloudflare']
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: yomu-strict-source-audit
  cancel-in-progress: true

jobs:
  audit:
    # Only audit a release after the production deploy workflow itself succeeded.
    # This prevents the audit from racing a push and testing the previous Worker.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          # On workflow_run, test with the exact source revision that was deployed.
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh live extension registry
        run: |
          curl --fail --silent --show-error --max-time 30 \
            https://yomu.yomuread.workers.dev/api/ext/refresh >/tmp/yomu-ext-refresh.json
          cat /tmp/yomu-ext-refresh.json
      - name: Require every active source to read end to end
        run: node tools/source-audit.mjs https://yomu.yomuread.workers.dev
