name: Nyx Scans live smoke
on:
  push:
    paths: ['.github/workflows/nyx-live-smoke.yml']
  workflow_dispatch:
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Diagnose current Nyx public API shape
        shell: bash
        run: |
          set -euo pipefail
          SITE='https://yomu.yomuread.workers.dev'
          API='https://api.nyxscans.com'
          curl -fsS "$SITE/api/ext/refresh" | jq .
          raw=$(curl -fsS --get --data-urlencode 'postSlug=operation-true-love' "$API/api/post")
          echo '=== /api/post top-level keys ==='
          echo "$raw" | jq 'keys'
          echo '=== post summary ==='
          echo "$raw" | jq '{postKeys:(.post|keys), postId:.post.id, slug:.post.slug, title:.post.postTitle, totalChapterCount, chaptersType:(.post.chapters|type), chaptersLen:(.post.chapters|length)}'
          if [[ "$(echo "$raw" | jq '.post.chapters|length')" -eq 0 ]]; then
            pid=$(echo "$raw" | jq -r '.post.id // empty')
            echo "=== chapter API fallback postId=$pid ==="
            ch=$(curl -fsS --get --data-urlencode "postId=$pid" "$API/api/chapters")
            echo "$ch" | jq '{keys:keys, postKeys:(.post|keys), chapterLen:(.post.chapters|length), first:(.post.chapters[0] // null)}'
          fi
