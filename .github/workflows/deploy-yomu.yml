name: Deploy Yomu to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dist-app/**'
      - 'worker/**'
      - 'extensions/**'
      - 'scripts/source-forge-gauntlet.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-yomu.yml'
      - '.github/workflows/source-forge-gauntlet.yml'

permissions:
  contents: read

concurrency:
  group: yomu-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Inject route helpers into exported HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          tags = [
              '<script src="/source-auto-switch.js" defer></script>',
              '<script src="/community-pack-top.js" defer></script>',
              '<link rel="stylesheet" href="/yomu-controls-base.css">',
              '<link rel="stylesheet" href="/yomu-controls-components.css">',
              '<link rel="stylesheet" href="/yomu-hero-plus.css">',
              '<script src="/yomu-controls.js" defer></script>',
              '<script src="/yomu-live-catalog.js" defer></script>',
              '<script src="/yomu-catalog-fix.js" defer></script>',
              '<script src="/yomu-hero-plus.js" defer></script>',
              '<script src="/source-beast-loader.js" defer></script>',
          ]
          changed = 0
          for path in Path('dist-app').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '</head>' not in text:
                  continue
              original = text
              for tag in tags:
                  if tag not in text:
                      text = text.replace('</head>', tag + '</head>', 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          print(f'Injected route helpers into {changed} HTML files.')
          PY
      # Accept either a raw Cloudflare token or a secret pasted as
      # "Bearer <token>". The latter used to become "Bearer Bearer <token>"
      # here and Cloudflare rejected it as Authorization header code 6111.
      # Normalize once, verify it, then pass the exact same cleaned token to
      # Wrangler through GITHUB_ENV without printing it to the log.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN_RAW" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_API_TOKEN.'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID. wrangler cannot pick an account on its own when the token can see more than one.'
            exit 1
          fi

          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"(.*)"$/\1/; s/^'\''(.*)'\''$/\1/')
          if [ -z "$token" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is empty after normalization.'
            exit 1
          fi

          status=$(curl -s -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          if [ "$status" != "200" ]; then
            echo "::error::The API token cannot read account $CLOUDFLARE_ACCOUNT_ID (HTTP $status). If Cloudflare reports an authentication error, replace the repository secret with a Cloudflare API Token that has Workers Scripts: Edit and Workers KV Storage: Edit for this account."
            cat /tmp/cf-verify.json
            exit 1
          fi

          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo "Token can read the account. Deploying."
      - name: Deploy production Worker and static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify live Yomu
        run: |
          set -e
          check() { echo "Checking $1"; shift; "$@"; }
          check sources curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/sources -o /tmp/yomu-sources.html
          grep -q 'source-auto-switch.js' /tmp/yomu-sources.html
          grep -q 'community-pack-top.js' /tmp/yomu-sources.html
          grep -q 'yomu-controls.js' /tmp/yomu-sources.html
          grep -q 'yomu-live-catalog.js' /tmp/yomu-sources.html
          grep -q 'yomu-catalog-fix.js' /tmp/yomu-sources.html
          grep -q 'yomu-hero-plus.js' /tmp/yomu-sources.html
          check add-source curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/add-sources -o /tmp/yomu-add-sources.html
          grep -q 'source-beast-loader.js' /tmp/yomu-add-sources.html
          check beast-loader curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/source-beast-loader.js -o /tmp/source-beast-loader.js
          grep -q 'source-beast-yomu.js' /tmp/source-beast-loader.js
          check beast-controller curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/source-beast-yomu.js -o /tmp/source-beast-yomu.js
          grep -q 'Yomu Source Beast' /tmp/source-beast-yomu.js
          check compact curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/community-pack-compact.js -o /tmp/community-pack-compact.js
          grep -q 'Community Pack source' /tmp/community-pack-compact.js
          check auto-switch curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/source-auto-switch.js -o /tmp/source-auto-switch.js
          grep -q 'Find another source' /tmp/source-auto-switch.js
          check community-top curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/community-pack-top.js -o /tmp/community-pack-top.js
          grep -q 'yomu-community-pack-top' /tmp/community-pack-top.js
          check controls curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/yomu-controls.js -o /tmp/yomu-controls.js
          grep -q 'yomu.v1.controls' /tmp/yomu-controls.js
          check live-catalog curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/yomu-live-catalog.js -o /tmp/yomu-live-catalog.js
          grep -q 'Live catalog glue' /tmp/yomu-live-catalog.js
          check catalog-fix curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/yomu-catalog-fix.js -o /tmp/yomu-catalog-fix.js
          grep -q 'Catalog truth layer' /tmp/yomu-catalog-fix.js
          check hero curl -L --fail --silent --show-error --retry 5 --retry-delay 3 https://yomu.yomuread.workers.dev/yomu-hero-plus.js -o /tmp/yomu-hero-plus.js
          grep -q 'Highest rated' /tmp/yomu-hero-plus.js
