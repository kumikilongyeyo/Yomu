name: Deploy Yomu to Cloudflare

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'dist-app/**'
      - 'worker/**'
      - 'extensions/**'
      - 'scripts/source-forge-gauntlet.mjs'
      - 'tools/search-gauntlet.mjs'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-yomu.yml'
      - '.github/workflows/source-forge-gauntlet.yml'

permissions:
  contents: read

concurrency:
  group: yomu-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck Worker
        run: npm run typecheck
      - name: Search UX gauntlet (10/10)
        run: node tools/search-gauntlet.mjs
      - name: Inject route helpers into exported HTML
        run: |
          python - <<'PY'
          from pathlib import Path

          tags = [
              '<script src="/source-auto-switch.js" defer></script>',
              '<script src="/community-pack-top.js" defer></script>',
              '<link rel="stylesheet" href="/yomu-controls-base.css">',
              '<link rel="stylesheet" href="/yomu-controls-components.css">',
              '<link rel="stylesheet" href="/yomu-hero-plus.css">',
              '<script src="/yomu-controls.js" defer></script>',
              # Search V3 is intentionally non-deferred. /find starts its first
              # query from an inline script while HTML is still parsing, so V3
              # must own fetch before that request can hit the slow all-source
              # wrappers. It re-installs itself at DOMContentLoaded after the
              # deferred reliability helpers have run.
              '<script src="/yomu-search-v3.js"></script>',
              '<script src="/yomu-search-fast-bootstrap.js" defer></script>',
              # These must be in every exported HTML file, not only Worker-first
              # routes. Search and Reader are static-asset routes, which is why
              # the reliability layer previously never ran there.
              '<script src="/yomu-source-reliability.js" defer></script>',
              '<script src="/yomu-source-ux-v2.js" defer></script>',
              '<script src="/yomu-search-fast.js" defer></script>',
              '<script src="/yomu-catalog-fix.js" defer></script>',
              '<script src="/yomu-hero-plus.js" defer></script>',
              '<script src="/source-beast-loader.js" defer></script>',
          ]
          changed = 0
          for path in Path('dist-app').rglob('*.html'):
              text = path.read_text(encoding='utf-8')
              if '</head>' not in text:
                  continue
              original = text
              for tag in tags:
                  if tag not in text:
                      text = text.replace('</head>', tag + '</head>', 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed += 1
          print(f'Injected route helpers into {changed} HTML files.')
          PY
      # Accept either a raw Cloudflare token or a secret pasted as
      # "Bearer <token>". The latter used to become "Bearer Bearer <token>"
      # here and Cloudflare rejected it as Authorization header code 6111.
      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN_RAW" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_API_TOKEN.'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID. wrangler cannot pick an account on its own when the token can see more than one.'
            exit 1
          fi

          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"(.*)"$/\1/; s/^'\''(.*)'\''$/\1/')
          if [ -z "$token" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is empty after normalization.'
            exit 1
          fi

          status=$(curl -s -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          if [ "$status" != "200" ]; then
            echo "::error::The API token cannot read account $CLOUDFLARE_ACCOUNT_ID (HTTP $status)."
            cat /tmp/cf-verify.json
            exit 1
          fi

          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo "Token can read the account. Deploying."
      - name: Deploy production Worker and static assets
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc
      - name: Verify live Yomu
        run: |
          set -e
          fetch_until() {
            name="$1"; url="$2"; pattern="$3"; file="$4"
            echo "Checking $name"
            for i in 1 2 3 4 5 6; do
              if curl -L --fail --silent --show-error --max-time 12 "$url" -o "$file" && grep -q "$pattern" "$file"; then
                echo "$name ready on attempt $i"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not expose expected marker: $pattern"
            return 1
          }

          # Verify the actual search surface and its new controller. Do not gate
          # Search on /sources carrying the same script: /find is the product
          # surface the reader uses and is the regression we are preventing.
          fetch_until search-v3 'https://yomu.yomuread.workers.dev/yomu-search-v3.js' 'Yomu Search V3' /tmp/yomu-search-v3.js
          fetch_until find-page 'https://yomu.yomuread.workers.dev/find?q=nano%20machine' 'yomu-search-v3.js' /tmp/yomu-find.html
          grep -q 'yomu-source-reliability.js' /tmp/yomu-find.html
          grep -q 'yomu-source-ux-v2.js' /tmp/yomu-find.html

          fetch_until search-page 'https://yomu.yomuread.workers.dev/search' 'yomu-search-v3.js' /tmp/yomu-search.html
          fetch_until reader-page 'https://yomu.yomuread.workers.dev/read/yomu-smoke' 'yomu-source-reliability.js' /tmp/yomu-reader.html
          grep -q 'yomu-source-ux-v2.js' /tmp/yomu-reader.html

          # Core helper assets must still be available after the search patch.
          fetch_until reliability 'https://yomu.yomuread.workers.dev/yomu-source-reliability.js' 'Yomu Source Reliability Layer' /tmp/yomu-source-reliability.js
          fetch_until source-ux 'https://yomu.yomuread.workers.dev/yomu-source-ux-v2.js' 'Yomu merged-source loading' /tmp/yomu-source-ux-v2.js
          fetch_until controls 'https://yomu.yomuread.workers.dev/yomu-controls.js' 'yomu.v1.controls' /tmp/yomu-controls.js
          fetch_until source-beast 'https://yomu.yomuread.workers.dev/source-beast-yomu.js' 'Yomu Source Beast' /tmp/source-beast-yomu.js
      - name: Search UX gauntlet against production (10/10)
        run: node tools/search-gauntlet.mjs https://yomu.yomuread.workers.dev
