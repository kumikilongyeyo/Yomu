name: Deploy Yomu to Cloudflare

on:
  workflow_dispatch:
  # The daily community refresh commits dist-app/community-picks.json with the
  # Actions token, and a push made with that token deliberately does not start
  # another workflow -- so without this the collected file would sit on main and
  # never reach the Worker's static assets. `workflow_run` is the one trigger
  # that does fire for it.
  workflow_run:
    workflows: ['Community picks']
    types: [completed]
  push:
    branches:
      - main
    paths:
      - 'dist-app/**'
      - 'worker/**'
      - 'extensions/**'
      - 'scripts/bundle-css.mjs'
      - 'scripts/optimize-export.py'
      - 'scripts/source-forge-gauntlet.mjs'
      - 'tools/gauntlet.mjs'
      - 'tools/search-gauntlet.mjs'
      - 'tools/library-gauntlet.mjs'
      - 'tools/uiux-gauntlet.mjs'
      - 'tools/performance-gauntlet.mjs'
      - 'tools/source-audit.mjs'
      - 'tools/progression/**'
      - 'tools/bench-library.mjs'
      - 'tests/**'
      - 'playwright.config.js'
      - 'wrangler.jsonc'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/deploy-yomu.yml'
      - '.github/workflows/source-forge-gauntlet.yml'
      - '.github/workflows/library-uiux-check.yml'

permissions:
  contents: read

concurrency:
  group: yomu-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    # A community collection that changed nothing, or failed, is not a release.
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    # The runtime gauntlet and the loading benchmark run before the upload, so
    # the job is a browser run now rather than a grep over files.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci

      # Before the optimizer on purpose: this collapses the stylesheets the
      # export itself wrote, and the optimizer then adds its route-aware ones
      # as ordinary links, so the release contracts below still find them.
      - name: Bundle exported stylesheets
        run: |
          node scripts/bundle-css.mjs
          # The filename carries a hash of the stylesheets, so it is the one
          # marker that proves the live origin is serving THIS release rather
          # than a cached copy of the last one. Resolved rather than globbed:
          # an unmatched glob would travel on as a literal and the live check
          # would wait for a file that can never appear.
          bundle=$(ls -1 dist-app/yomu-app-*.css 2>/dev/null | head -1)
          if [ -z "$bundle" ]; then
            echo '::error::bundle-css.mjs produced no stylesheet bundle.'
            exit 1
          fi
          echo "YOMU_CSS_BUNDLE=$(basename "$bundle")" >> "$GITHUB_ENV"

      - name: Optimize exported HTML
        run: python3 scripts/optimize-export.py

      - name: Engineering gauntlet (offline release gate)
        run: node tools/gauntlet.mjs --offline

      - name: Search UX gauntlet (10/10)
        run: node tools/search-gauntlet.mjs

      - name: Full-source Library gauntlet (10/10 only)
        run: node tools/library-gauntlet.mjs

      - name: Library UI UX gauntlet (10/10 only)
        run: node tools/uiux-gauntlet.mjs

      - name: Performance and loading gauntlet (10/10 only)
        run: node tools/performance-gauntlet.mjs

      # The gates above read source files. These two drive the real export in a
      # real browser, because a release that greps clean and renders two More
      # buttons is the failure mode this suite exists to stop.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Runtime gauntlet (every viewport, no failures allowed)
        run: npx playwright test

      - name: Loading benchmark against the release budgets
        run: node tools/bench-library.mjs --candidate ./dist-app --runs 5

      - name: Upload runtime gauntlet evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: yomu-runtime-gauntlet
          path: |
            playwright-report/
            docs/recovery/benchmark.json
            docs/recovery/benchmark.csv
          retention-days: 14
          if-no-files-found: ignore

      - name: Check Cloudflare credentials
        env:
          CLOUDFLARE_API_TOKEN_RAW: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN_RAW" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_API_TOKEN.'
            exit 1
          fi
          if [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo '::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID. wrangler cannot pick an account on its own when the token can see more than one.'
            exit 1
          fi

          token=$(printf '%s' "$CLOUDFLARE_API_TOKEN_RAW" \
            | tr -d '\r\n' \
            | sed -E 's/^[[:space:]]*[Bb][Ee][Aa][Rr][Ee][Rr][[:space:]]+//; s/^[[:space:]]+//; s/[[:space:]]+$//; s/^"(.*)"$/\1/; s/^'\''(.*)'\''$/\1/')
          if [ -z "$token" ]; then
            echo '::error::CLOUDFLARE_API_TOKEN is empty after normalization.'
            exit 1
          fi

          status=$(curl -s -o /tmp/cf-verify.json -w '%{http_code}' \
            -H "Authorization: Bearer $token" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID")
          if [ "$status" != "200" ]; then
            echo "::error::The API token cannot read account $CLOUDFLARE_ACCOUNT_ID (HTTP $status)."
            cat /tmp/cf-verify.json
            exit 1
          fi

          printf 'CLOUDFLARE_API_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          echo "Token can read the account. Deploying."

      - name: Deploy production Worker and static assets
        id: deploy
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --config wrangler.jsonc

      - name: Verify live Yomu
        run: |
          set -e
          # An empty marker would make the release wait on grep -q "", which
          # matches every page including the one this deploy replaced.
          if [ -z "$YOMU_CSS_BUNDLE" ]; then
            echo '::error::The stylesheet bundle name was never captured, so the live check cannot tell this release from the last one.'
            exit 1
          fi
          fetch_until() {
            name="$1"; url="$2"; pattern="$3"; file="$4"
            echo "Checking $name"
            for i in 1 2 3 4 5 6; do
              if curl -L --fail --silent --show-error --max-time 12 "$url" -o "$file" && grep -q "$pattern" "$file"; then
                echo "$name ready on attempt $i"
                return 0
              fi
              sleep 2
            done
            echo "::error::$name did not expose expected marker: $pattern"
            return 1
          }

          fetch_until search-v3 'https://yomu.yomuread.workers.dev/yomu-search-v3.js' 'Yomu Search V3' /tmp/yomu-search-v3.js
          fetch_until performance 'https://yomu.yomuread.workers.dev/yomu-performance.js' 'Yomu performance fast lane' /tmp/yomu-performance.js
          fetch_until loading-policy 'https://yomu.yomuread.workers.dev/yomu-loading-policy.js' 'Yomu loading visibility policy' /tmp/yomu-loading-policy.js
          fetch_until explore-more 'https://yomu.yomuread.workers.dev/yomu-explore-more.js' 'Yomu progressive exploration controls' /tmp/yomu-explore-more.js
          fetch_until titlecard 'https://yomu.yomuread.workers.dev/yomu-titlecard.js' 'Yomu canonical TitleCard' /tmp/yomu-titlecard.js
          fetch_until titlecard-css 'https://yomu.yomuread.workers.dev/yomu-titlecard.css' 'yt-card__art' /tmp/yomu-titlecard.css
          fetch_until pager 'https://yomu.yomuread.workers.dev/yomu-pager.js' 'Yomu pagination ownership' /tmp/yomu-pager.js
          # The legacy second control must not be on the live origin at all.
          if grep -q 'yomu-generic-more' /tmp/yomu-explore-more.js; then
            echo '::error::The live explore-more still builds the duplicate More control.'
            exit 1
          fi

          # Wait on a marker unique to the federated-library release before
          # running one-shot helper greps, avoiding stale-edge races.
          fetch_until find-page 'https://yomu.yomuread.workers.dev/find?q=nano%20machine' 'yomu-library-engine.js' /tmp/yomu-find.html
          grep -q 'yomu-performance.js' /tmp/yomu-find.html
          grep -q 'yomu-loading-policy.js' /tmp/yomu-find.html
          grep -q 'yomu-explore-more.js' /tmp/yomu-find.html
          grep -q 'yomu-search-v3.js' /tmp/yomu-find.html
          grep -q 'yomu-source-reliability.js' /tmp/yomu-find.html
          grep -q 'yomu-source-ux-v2.js' /tmp/yomu-find.html
          grep -q 'yomu-library-explorer.js' /tmp/yomu-find.html

          # Anchored on this release's stylesheet bundle. The previous marker was
          # yomu-library-engine.js, which every release since the federated library
          # has carried -- so a stale edge copy satisfied it and the one-shot greps
          # below then ran against the previous page and failed the release.
          fetch_until home-page 'https://yomu.yomuread.workers.dev/' "$YOMU_CSS_BUNDLE" /tmp/yomu-home.html
          grep -q 'yomu-library-engine.js' /tmp/yomu-home.html
          grep -q 'yomu-performance.js' /tmp/yomu-home.html
          grep -q 'yomu-loading-policy.js' /tmp/yomu-home.html
          grep -q 'yomu-explore-more.js' /tmp/yomu-home.html
          grep -q 'yomu-mori-chat.js' /tmp/yomu-home.html
          grep -q 'yomu-mori-drag.js' /tmp/yomu-home.html
          grep -q 'yomu-titlecard.js' /tmp/yomu-home.html
          grep -q 'yomu-titlecard.css' /tmp/yomu-home.html
          # The bundle is proven live by the fetch_until above; what is left to
          # check is that none of the files it replaced came back alongside it as
          # a second copy of the same bytes.
          if grep -qE 'href="/yomu-(overrides|skin|tags|look)\.css"' /tmp/yomu-home.html; then
            echo '::error::Home serves the bundle and the individual stylesheets it replaced.'
            exit 1
          fi
          grep -q 'yomu-pager.js' /tmp/yomu-home.html
          grep -q 'yomu-titlecard.js' /tmp/yomu-find.html
          grep -q 'yomu-pager.js' /tmp/yomu-find.html

          fetch_until library-engine 'https://yomu.yomuread.workers.dev/yomu-library-engine.js' 'Yomu Library Engine' /tmp/yomu-library-engine.js
          fetch_until library-explorer 'https://yomu.yomuread.workers.dev/yomu-library-explorer.js' 'Full-source browsing surface' /tmp/yomu-library-explorer.js
          fetch_until mori-chat 'https://yomu.yomuread.workers.dev/yomu-mori-chat.js' 'Mori Chat' /tmp/yomu-mori-chat.js
          fetch_until mori-drag 'https://yomu.yomuread.workers.dev/yomu-mori-drag.js' "minimized + puck" /tmp/yomu-mori-drag.js

          fetch_until search-page 'https://yomu.yomuread.workers.dev/search' 'yomu-search-v3.js' /tmp/yomu-search.html
          fetch_until reader-page 'https://yomu.yomuread.workers.dev/read/yomu-smoke' 'yomu-source-reliability.js' /tmp/yomu-reader.html
          grep -q 'yomu-loading-policy.js' /tmp/yomu-reader.html
          grep -q 'yomu-performance.js' /tmp/yomu-reader.html
          grep -q 'yomu-source-ux-v2.js' /tmp/yomu-reader.html

          fetch_until reliability 'https://yomu.yomuread.workers.dev/yomu-source-reliability.js' 'Yomu Source Reliability Layer' /tmp/yomu-source-reliability.js
          fetch_until source-ux 'https://yomu.yomuread.workers.dev/yomu-source-ux-v2.js' 'Yomu merged-source loading' /tmp/yomu-source-ux-v2.js
          fetch_until controls 'https://yomu.yomuread.workers.dev/yomu-controls.js' 'yomu.v1.controls' /tmp/yomu-controls.js
          fetch_until source-beast 'https://yomu.yomuread.workers.dev/source-beast-yomu.js' 'Yomu Source Beast' /tmp/source-beast-yomu.js
          fetch_until service-worker 'https://yomu.yomuread.workers.dev/sw.js' "SHELL_VERSION = 'v3'" /tmp/yomu-sw.js
          grep -q 'navigationPreload' /tmp/yomu-sw.js
          grep -q 'staleWhileRevalidate' /tmp/yomu-sw.js
          # sw.js being served proves nothing on its own: it shipped for months
          # while only chapter downloads ever registered it.
          fetch_until sw-registrar 'https://yomu.yomuread.workers.dev/yomu-sw.js' 'Yomu service worker registration' /tmp/yomu-sw-registrar.js
          grep -q "register('/sw.js')" /tmp/yomu-sw-registrar.js
          grep -q 'yomu-sw.js' /tmp/yomu-home.html

      - name: Full engineering gauntlet against production
        run: node tools/gauntlet.mjs https://yomu.yomuread.workers.dev

      - name: Search UX gauntlet against production (10/10)
        run: node tools/search-gauntlet.mjs https://yomu.yomuread.workers.dev

      - name: Full-source Library gauntlet against production (10/10 only)
        run: node tools/library-gauntlet.mjs https://yomu.yomuread.workers.dev

      - name: Library UI UX gauntlet against production (10/10 only)
        run: node tools/uiux-gauntlet.mjs https://yomu.yomuread.workers.dev

      - name: Performance and loading gauntlet against production (10/10 only)
        run: node tools/performance-gauntlet.mjs https://yomu.yomuread.workers.dev

      # Every enabled source, all the way down: browse, search, details,
      # chapters, and a page manifest the reader would actually accept. A
      # source that browses but cannot serve a chapter looks perfect on Home
      # and is useless the moment anybody taps it.
      - name: Source audit against production
        run: node tools/source-audit.mjs https://yomu.yomuread.workers.dev

      - name: Roll back failed production release
        if: ${{ failure() && steps.deploy.outcome == 'success' }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo 'Release validation failed. Rolling Yomu back to the previously deployed Worker version.'
          npx wrangler rollback --config wrangler.jsonc --message 'Automated rollback: Yomu release gauntlet failed'
