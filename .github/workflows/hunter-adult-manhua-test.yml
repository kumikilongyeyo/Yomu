name: Hunter adult manhua test

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/hunter-adult-manhua-test.yml'
      - 'tools/source-forge/src/hunter-adult-manhua-test.js'

permissions:
  contents: read

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Source Forge dependencies
        run: npm --prefix tools/source-forge install --no-audit --no-fund
      - name: Install Chromium
        run: |
          cd tools/source-forge
          npx playwright install --with-deps chromium
      - name: Expose Hunter candidate tester on runner
        run: echo 'export { testCandidate };' >> tools/source-forge/src/hunter.js
      - name: Run targeted adult/manhua gauntlet
        run: node tools/source-forge/src/hunter-adult-manhua-test.js
      - name: Publish summary
        if: always()
        run: cat hunter-adult-manhua-output/summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload targeted report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yomu-hunter-adult-manhua-test
          path: hunter-adult-manhua-output/
          if-no-files-found: warn
          retention-days: 14
