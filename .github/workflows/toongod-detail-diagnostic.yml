name: ToonGod detail diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/toongod-detail-diagnostic.yml']

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect current ToonGod selectors
        run: |
          set -euo pipefail
          URL='https://www.toongod.cc/webtoon/tales-of-demons-and-gods/'
          curl -L --fail --silent --show-error --max-time 30 \
            -A 'Mozilla/5.0 (compatible; Yomu/0.3; +https://yomu.yomuread.workers.dev)' \
            -H 'Accept: text/html,application/xhtml+xml' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Referer: https://www.toongod.cc/' \
            "$URL" -o page.html
          node <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('page.html','utf8');
          console.log('bytes=',h.length);
          const needles=['TALES OF DEMONS','chapter-','/chapter/','/chapters/','class="chapter','class="list','class="detail','class="manga','description','genres','status','author','latest-chapter','episode'];
          for(const needle of needles){
            let i=0, seen=0;
            while((i=h.toLowerCase().indexOf(needle.toLowerCase(),i))>=0 && seen<4){
              console.log(`\n--- ${needle} #${seen+1} ---\n${h.slice(Math.max(0,i-450),Math.min(h.length,i+1300)).replace(/\s+/g,' ')}`);
              i+=needle.length; seen++;
            }
          }
          const hrefs=[...h.matchAll(/href=["']([^"']+)["']/gi)].map(m=>m[1]);
          const chap=hrefs.filter(x=>/chapter|chapters|episode|ep-/i.test(x));
          console.log('\nchapter-like href count=',chap.length);
          console.log([...new Set(chap)].slice(0,40).join('\n'));
          NODE
